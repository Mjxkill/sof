CONFIG_IMX8M=y
CONFIG_HAVE_AGENT=n
CONFIG_FORMAT_CONVERT_HIFI3=n
CONFIG_KPB_FORCE_COPY_TYPE_NORMAL=n

# Effects for capture path
CONFIG_COMP_DRC=y

# Phase 1a master chain + routing (V2.3)
CONFIG_COMP_VOLUME=y
CONFIG_COMP_CROSSOVER=y
CONFIG_COMP_MULTIBAND_DRC=y
CONFIG_COMP_MUX=y

# Phase 1a.3 mixer (V4.2) — legacy IPC3 mixer limited to 2 sources
CONFIG_COMP_MIXER=y

# V5.4.1 Phase 1a.3 — eq_iir for input channel strips (E5)
CONFIG_COMP_IIR=y

# V5.4.1 Phase 1a.3 E1 — new components for matrix routing
CONFIG_COMP_TEE_1TO2=y
CONFIG_COMP_MIXER16=y
CONFIG_COMP_INTERLEAVE_8=y
